name: BotHub mesh tests

on:
  push:
    branches: [main]
    paths:
      - "bothub_mesh.py"
      - "test_bothub_mesh.py"
      - ".github/workflows/bothub-mesh-tests.yml"
  pull_request:
    paths:
      - "bothub_mesh.py"
      - "test_bothub_mesh.py"
      - ".github/workflows/bothub-mesh-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run mesh unit tests
        env:
          BOTHUB_MESH_SECRET: test-only-secret-do-not-use-in-production-0000000000
        run: python -m unittest -v test_bothub_mesh.py
