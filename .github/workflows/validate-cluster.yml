name: Validate BotHub cluster
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/cooperative-cluster-personality]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m py_compile main.py bothub_firebase_worker.py add_cluster_server.py
